; Konfigurasi Supervisor untuk Redis Queue Worker Websinkronisasi
; Referensi: NFR-06, NFR-07
; Lokasi Instalasi: /etc/supervisor/conf.d/websinkronisasi-worker.conf

[program:websinkronisasi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=high,default,low --sleep=3 --tries=3 --timeout=120 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/websinkronisasi-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=60
priority=999

