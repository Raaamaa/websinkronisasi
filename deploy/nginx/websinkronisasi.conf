# Konfigurasi Nginx Reverse Proxy Produksi (Websinkronisasi)
# Referensi: NFR-03 (HTTPS/SSL), NFR-15 (HTTP/2), D8 (Intranet VPN/LAN), BD-02, BD-10

server {
    listen 80;
    listen [::]:80;
    server_name websinkronisasi.bps.go.id;

    # Pengalihan otomatis ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name websinkronisasi.bps.go.id;

    root /var/www/html/public;
    index index.php index.html;

    # Sertifikat SSL/TLS Internal Kantor (NFR-03)
    ssl_certificate /etc/ssl/certs/websinkronisasi.crt;
    ssl_certificate_key /etc/ssl/private/websinkronisasi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas Maksimal Upload Berkas (BD-02: 20MB + 5MB overhead form)
    client_max_body_size 25M;

    # Header Keamanan Ketat (Security Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    charset utf-8;

    # Routing Laravel SPA / Filament Livewire
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir akses langsung ke berkas tersembunyi (.env, .git, dll.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proteksi Direktori Penyimpanan Privat (BD-10, NFR-04)
    location ^~ /storage/app/private/ {
        deny all;
        return 404;
    }

    # Penanganan PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000; # atau unix:/var/run/php/php8.3-fpm.sock
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Optimasi Asset Statis
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
