services:
  nginx:
    image: nginx:alpine
    container_name: websinkronisasi_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/websinkronisasi.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app
    networks:
      - websinkronisasi_prod_net

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.prod
      args:
        PUID: 1000
        PGID: 1000
    container_name: websinkronisasi_app_prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./storage/app/private:/var/www/html/storage/app/private
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websinkronisasi_prod_net

  queue-worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.prod
      args:
        PUID: 1000
        PGID: 1000
    container_name: websinkronisasi_queue_worker_prod
    restart: always
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes:
      - ./storage/app/private:/var/www/html/storage/app/private
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websinkronisasi_prod_net

  postgres:
    image: postgres:15-alpine
    container_name: websinkronisasi_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-websinkronisasi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-websinkronisasi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websinkronisasi_prod_net

  redis:
    image: redis:7-alpine
    container_name: websinkronisasi_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websinkronisasi_prod_net

volumes:
  postgres_data_prod:
    name: websinkronisasi_postgres_data_prod
  redis_data_prod:
    name: websinkronisasi_redis_data_prod

networks:
  websinkronisasi_prod_net:
    driver: bridge

