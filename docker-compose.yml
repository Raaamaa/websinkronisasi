services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PUID: 1000
        PGID: 1000
    container_name: websinkronisasi_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s
    networks:
      - websinkronisasi_net

  queue-worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PUID: 1000
        PGID: 1000
    container_name: websinkronisasi_queue_worker
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websinkronisasi_net

  postgres:
    image: postgres:15-alpine
    container_name: websinkronisasi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-websinkronisasi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel di .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-websinkronisasi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websinkronisasi_net

  redis:
    image: redis:7-alpine
    container_name: websinkronisasi_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib disetel di .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websinkronisasi_net

volumes:
  postgres_data:
    name: websinkronisasi_postgres_data
  redis_data:
    name: websinkronisasi_redis_data

networks:
  websinkronisasi_net:
    name: websinkronisasi_net
    driver: bridge
